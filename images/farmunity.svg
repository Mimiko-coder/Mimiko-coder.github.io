<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2e1a"/>
      <stop offset="100%" stop-color="#0f1f0f"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="800" y2="0">
      <stop offset="0%" stop-color="#2d4a2d"/>
      <stop offset="100%" stop-color="#1a331a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sky)"/>
  <ellipse cx="200" cy="120" rx="80" ry="30" fill="#c9a87c" opacity="0.08"/>
  <ellipse cx="600" cy="90" rx="100" ry="35" fill="#c9a87c" opacity="0.06"/>
  <path d="M0 380 Q200 340 400 360 Q600 380 800 350 L800 600 L0 600 Z" fill="url(#field)"/>
  <path d="M0 420 Q250 390 500 410 Q650 420 800 400 L800 600 L0 600 Z" fill="#1f3d1f" opacity="0.6"/>

  <!-- Wheat stalks -->
  <g opacity="0.7">
    <line x1="100" y1="400" x2="100" y2="320" stroke="#c9a87c" stroke-width="2"/>
    <ellipse cx="100" cy="310" rx="8" ry="20" fill="#c9a87c" opacity="0.6"/>
    <line x1="700" y1="390" x2="700" y2="310" stroke="#c9a87c" stroke-width="2"/>
    <ellipse cx="700" cy="300" rx="8" ry="20" fill="#c9a87c" opacity="0.6"/>
    <line x1="650" y1="410" x2="650" y2="340" stroke="#c9a87c" stroke-width="2"/>
    <ellipse cx="650" cy="330" rx="6" ry="16" fill="#c9a87c" opacity="0.5"/>
  </g>

  <!-- Farmer figure -->
  <g transform="translate(340, 200)">
    <ellipse cx="60" cy="200" rx="50" ry="12" fill="#000" opacity="0.25"/>
    <rect x="35" y="120" width="50" height="70" rx="8" fill="#3d4a3d"/>
    <rect x="30" y="80" width="60" height="50" rx="10" fill="#4a5a4a"/>
    <circle cx="60" cy="55" r="28" fill="#c9a87c" opacity="0.85"/>
    <ellipse cx="60" cy="48" rx="22" ry="8" fill="#8b7355" opacity="0.5"/>
    <rect x="20" y="130" width="18" height="55" rx="6" fill="#4a5a4a"/>
    <rect x="82" y="130" width="18" height="55" rx="6" fill="#4a5a4a"/>
    <rect x="42" y="185" width="16" height="40" rx="5" fill="#2d3a2d"/>
    <rect x="62" y="185" width="16" height="40" rx="5" fill="#2d3a2d"/>
    <line x1="95" y1="100" x2="130" y2="60" stroke="#8b6914" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="135" cy="55" rx="12" ry="8" fill="#c9a87c" opacity="0.7" transform="rotate(-30 135 55)"/>
  </g>

  <!-- Barn silhouette -->
  <g transform="translate(80, 280)" opacity="0.4">
    <path d="M0 100 L60 40 L120 100 Z" fill="#2a3a2a"/>
    <rect x="10" y="100" width="100" height="60" fill="#1f2f1f"/>
  </g>
</svg>
