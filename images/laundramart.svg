<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="600">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#12121f"/>
    </linearGradient>
    <linearGradient id="machine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d4458"/>
      <stop offset="100%" stop-color="#252a38"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5ec4b6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c9a87c" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5ec4b6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#5ec4b6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <ellipse cx="400" cy="480" rx="280" ry="40" fill="#000" opacity="0.3"/>
  <circle cx="400" cy="300" r="180" fill="url(#glow)"/>

  <!-- Machine 1 -->
  <g transform="translate(120, 140)">
    <rect x="0" y="0" width="160" height="280" rx="16" fill="url(#machine)" stroke="#4a5568" stroke-width="2"/>
    <rect x="20" y="30" width="120" height="120" rx="60" fill="#1a1f2e" stroke="#5ec4b6" stroke-width="3"/>
    <circle cx="80" cy="90" r="45" fill="url(#glass)"/>
    <circle cx="80" cy="90" r="30" fill="none" stroke="#5ec4b6" stroke-width="2" stroke-dasharray="8 6" opacity="0.7"/>
    <rect x="50" y="175" width="60" height="12" rx="6" fill="#c9a87c" opacity="0.8"/>
    <circle cx="40" cy="210" r="6" fill="#5ec4b6"/>
    <circle cx="60" cy="210" r="6" fill="#5ec4b6" opacity="0.5"/>
    <circle cx="80" cy="210" r="6" fill="#5ec4b6" opacity="0.3"/>
  </g>

  <!-- Machine 2 (center, featured) -->
  <g transform="translate(320, 110)">
    <rect x="0" y="0" width="160" height="310" rx="16" fill="url(#machine)" stroke="#c9a87c" stroke-width="2.5"/>
    <rect x="20" y="30" width="120" height="130" rx="60" fill="#1a1f2e" stroke="#c9a87c" stroke-width="3"/>
    <circle cx="80" cy="95" r="48" fill="url(#glass)"/>
    <path d="M50 95 Q80 60 110 95 Q80 130 50 95" fill="#5ec4b6" opacity="0.15"/>
    <circle cx="80" cy="95" r="32" fill="none" stroke="#c9a87c" stroke-width="2.5"/>
    <rect x="45" y="190" width="70" height="14" rx="7" fill="#c9a87c"/>
    <circle cx="40" cy="230" r="7" fill="#c9a87c"/>
    <circle cx="65" cy="230" r="7" fill="#5ec4b6"/>
    <circle cx="90" cy="230" r="7" fill="#5ec4b6" opacity="0.5"/>
    <circle cx="115" cy="230" r="7" fill="#5ec4b6" opacity="0.3"/>
  </g>

  <!-- Machine 3 -->
  <g transform="translate(520, 140)">
    <rect x="0" y="0" width="160" height="280" rx="16" fill="url(#machine)" stroke="#4a5568" stroke-width="2"/>
    <rect x="20" y="30" width="120" height="120" rx="60" fill="#1a1f2e" stroke="#5ec4b6" stroke-width="3"/>
    <circle cx="80" cy="90" r="45" fill="url(#glass)"/>
    <circle cx="80" cy="90" r="28" fill="none" stroke="#5ec4b6" stroke-width="2"/>
    <rect x="50" y="175" width="60" height="12" rx="6" fill="#c9a87c" opacity="0.8"/>
    <circle cx="100" cy="210" r="6" fill="#5ec4b6"/>
    <circle cx="80" cy="210" r="6" fill="#5ec4b6" opacity="0.5"/>
    <circle cx="60" cy="210" r="6" fill="#5ec4b6" opacity="0.3"/>
  </g>

  <!-- Bubbles -->
  <circle cx="200" cy="100" r="12" fill="#5ec4b6" opacity="0.2"/>
  <circle cx="230" cy="80" r="8" fill="#c9a87c" opacity="0.25"/>
  <circle cx="580" cy="90" r="10" fill="#5ec4b6" opacity="0.2"/>
  <circle cx="610" cy="120" r="6" fill="#c9a87c" opacity="0.2"/>
  <circle cx="150" cy="450" r="14" fill="#5ec4b6" opacity="0.15"/>
  <circle cx="650" cy="440" r="11" fill="#c9a87c" opacity="0.15"/>

  <!-- Floor line -->
  <rect x="80" y="430" width="640" height="3" rx="1.5" fill="#c9a87c" opacity="0.3"/>
</svg>
