      <stop offset="0%" stop-color="#1f1528"/>
      <stop offset="100%" stop-color="#12121f"/>
    </linearGradient>
    <radialGradient id="aiGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5ec4b6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#5ec4b6" stop-opacity="0"/>
