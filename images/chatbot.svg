  <!-- Connection line -->
  <path d="M310 300 Q380 280 420 300" stroke="#5ec4b6" stroke-width="2" stroke-dasharray="6 4" opacity="0.5"/>
  <circle cx="310" cy="300" r="5" fill="#5ec4b6" opacity="0.6"/>
  <circle cx="420" cy="300" r="5" fill="#5ec4b6" opacity="0.6"/>
